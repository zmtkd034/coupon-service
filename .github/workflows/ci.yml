name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: coupon
          POSTGRES_PASSWORD: coupon
          POSTGRES_DB: coupon_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U coupon" --health-interval 5s
          --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check app tests
      - name: Syntax check (build)
        run: python -m compileall -q app
      - name: Unit + DB concurrency tests
        env:
          TEST_DATABASE_URL: postgresql://coupon:coupon@localhost:5432/coupon_test
        run: pytest -v

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JS syntax check
        run: node --check frontend/app.js
      - name: nginx config check
        run: |
          docker run --rm -v "$PWD/frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginx:stable nginx -t
